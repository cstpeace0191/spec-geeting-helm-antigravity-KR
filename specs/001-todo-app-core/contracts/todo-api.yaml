openapi: 3.1.0
info:
  title: Todo App Core REST API
  description: Getting Started Todo App의 핵심 REST API 엔드포인트 명세
  version: 1.0.0
servers:
  - url: /api
    description: 기본 API 경로

paths:
  /greeting:
    get:
      summary: 시스템 환영 인사말 조회
      operationId: getGreeting
      responses:
        '200':
          description: 정상 환영 메시지 반환
          content:
            application/json:
              schema:
                type: object
                required:
                  - greeting
                properties:
                  greeting:
                    type: string
                    example: "Hello world!"

  /items:
    get:
      summary: 할 일 전체 목록 조회
      operationId: getItems
      description: 저장된 모든 할 일 목록을 등록 순(FIFO)으로 조회합니다.
      responses:
        '200':
          description: 할 일 목록 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoItem'

    post:
      summary: 신규 할 일 등록
      operationId: addItem
      description: 새로운 할 일을 생성하고 고유 UUID를 부여하여 미완료 상태로 등록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "우유 사기"
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem'
        '400':
          description: 유효하지 않은 입력 (빈 문자열 또는 255자 초과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/{id}:
    put:
      summary: 할 일 상태 및 내용 수정
      operationId: updateItem
      description: 특정 할 일의 완료 여부나 이름을 수정합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 할 일 고유 식별자 (UUID v4)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - completed
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "우유 사기"
                completed:
                  type: boolean
                  example: true
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem'
        '404':
          description: 해당 ID의 할 일을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: 할 일 즉시 영구 삭제
      operationId: deleteItem
      description: 특정 할 일을 확인 팝업 없이 즉시 영구 삭제합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 삭제할 할 일 고유 식별자 (UUID v4)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제 성공
        '404':
          description: 해당 ID의 할 일을 찾을 수 없음

components:
  schemas:
    TodoItem:
      type: object
      required:
        - id
        - name
        - completed
      properties:
        id:
          type: string
          format: uuid
          example: "a7c858d4-5394-4d89-9fc6-9e900996c561"
        name:
          type: string
          maxLength: 255
          example: "우유 사기"
        completed:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Item name cannot be empty or exceed 255 characters"

